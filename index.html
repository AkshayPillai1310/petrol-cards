<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrol Card Registry</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f3;
    --bg-tertiary: #eeede9;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-tertiary: #9a9a9a;
    --border: rgba(0,0,0,0.12);
    --border-md: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'Courier New', monospace;
  }
  body { font-family: var(--font); background: var(--bg-tertiary); color: var(--text); min-height: 100vh; }

  header { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 36px; height: 36px; border-radius: var(--radius-md); background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  .logo-icon i { color: #fff; font-size: 18px; }
  .logo-text { font-size: 15px; font-weight: 600; }
  .logo-sub { font-size: 11px; color: var(--text-secondary); }
  .header-right { display: flex; gap: 8px; align-items: center; }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 14px 18px; }
  .stat-label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 600; line-height: 1; }
  .stat-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  .card { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 18px 20px; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .brand-btn { padding: 6px 16px; border-radius: var(--radius-md); border: 0.5px solid var(--border-md); background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; font-family: var(--font); transition: all 0.15s; font-weight: 500; }
  .brand-btn:hover { background: var(--bg-secondary); }
  .brand-btn.active { background: var(--bg-secondary); color: var(--text); border-color: rgba(0,0,0,0.3); }
  .brand-btn.hp.active { background: #FFF3E0; color: #BF360C; border-color: #FF8F00; }
  .brand-btn.bpcl.active { background: #E8F5E9; color: #1B5E20; border-color: #43A047; }
  .brand-btn.iocl.active { background: #E3F2FD; color: #0D47A1; border-color: #1E88E5; }
  .search-bar { flex: 1; min-width: 200px; padding: 7px 12px; border-radius: var(--radius-md); border: 0.5px solid var(--border-md); background: var(--bg-secondary); color: var(--text); font-size: 13px; font-family: var(--font); outline: none; }
  .search-bar:focus { border-color: rgba(0,0,0,0.4); background: var(--bg); }
  .add-btn { padding: 7px 16px; border-radius: var(--radius-md); border: none; background: #1a1a1a; color: #fff; font-size: 13px; cursor: pointer; font-family: var(--font); white-space: nowrap; display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .add-btn:hover { background: #333; }
  .export-btn { padding: 7px 14px; border-radius: var(--radius-md); border: 0.5px solid var(--border-md); background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; font-family: var(--font); display: flex; align-items: center; gap: 6px; }
  .export-btn:hover { background: var(--bg-secondary); color: var(--text); }
  .refresh-btn { padding: 7px 12px; border-radius: var(--radius-md); border: 0.5px solid var(--border-md); background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; font-family: var(--font); display: flex; align-items: center; gap: 6px; }
  .refresh-btn:hover { background: var(--bg-secondary); color: var(--text); }

  .table-wrap { overflow-x: auto; border-radius: var(--radius-md); border: 0.5px solid var(--border); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--bg-secondary); color: var(--text-secondary); font-weight: 500; font-size: 11px; text-align: left; padding: 9px 12px; border-bottom: 0.5px solid var(--border); white-space: nowrap; letter-spacing: 0.3px; }
  td { padding: 9px 12px; border-bottom: 0.5px solid var(--border); color: var(--text); vertical-align: middle; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-secondary); }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 100px; font-size: 11px; font-weight: 600; }
  .badge-hp { background: #FFF3E0; color: #BF360C; }
  .badge-bpcl { background: #E8F5E9; color: #1B5E20; }
  .badge-iocl { background: #E3F2FD; color: #0D47A1; }
  .badge-active { background: #E8F5E9; color: #1B5E20; }
  .badge-inactive { background: #F5F5F5; color: #757575; }
  .badge-blocked { background: #FFF3E0; color: #E65100; }

  .pin-cell { font-family: var(--font-mono); font-size: 13px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 5px; }
  .pin-cell i { font-size: 13px; color: var(--text-tertiary); }
  .actions { display: flex; gap: 4px; }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-tertiary); font-size: 16px; padding: 3px 4px; border-radius: 6px; transition: all 0.12s; }
  .icon-btn:hover { color: var(--text); background: var(--bg-tertiary); }
  .icon-btn.del:hover { color: #c62828; background: #ffebee; }

  .empty-row td { text-align: center; padding: 40px; color: var(--text-tertiary); font-size: 14px; }

  .loading-row td { text-align: center; padding: 40px; color: var(--text-tertiary); font-size: 14px; }

  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 24px 28px; width: 580px; max-width: 95vw; max-height: 92vh; overflow-y: auto; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-header h2 { font-size: 16px; font-weight: 600; }
  .close-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--text-secondary); padding: 2px; }
  .close-btn:hover { color: var(--text); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
  .form-group input, .form-group select { padding: 8px 10px; border-radius: var(--radius-md); border: 0.5px solid var(--border-md); background: var(--bg); color: var(--text); font-size: 13px; font-family: var(--font); width: 100%; outline: none; transition: border 0.15s; }
  .form-group input:focus, .form-group select:focus { border-color: rgba(0,0,0,0.5); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 0.5px solid var(--border); }
  .btn-cancel { padding: 7px 18px; border-radius: var(--radius-md); border: 0.5px solid var(--border-md); background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; font-family: var(--font); }
  .btn-cancel:hover { background: var(--bg-secondary); }
  .btn-save { padding: 7px 20px; border-radius: var(--radius-md); border: none; background: #1a1a1a; color: #fff; font-size: 13px; cursor: pointer; font-family: var(--font); font-weight: 500; min-width: 90px; }
  .btn-save:hover { background: #333; }
  .btn-save:disabled { background: #999; cursor: not-allowed; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: var(--radius-md); font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .toast.error { background: #c62828; }

  .sync-indicator { font-size: 11px; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #4CAF50; display: inline-block; }
  .sync-dot.loading { background: #FF9800; animation: pulse 1s infinite; }
  .sync-dot.error { background: #f44336; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  @media (max-width: 700px) {
    .stat-row { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    header { padding: 12px 16px; }
    main { padding: 16px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-gas-station"></i></div>
    <div>
      <div class="logo-text">Petrol Card Registry</div>
      <div class="logo-sub">HP · BPCL · IOCL</div>
    </div>
  </div>
  <div class="header-right">
    <div class="sync-indicator">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-text">Connected</span>
    </div>
    <button class="refresh-btn" onclick="loadCards()"><i class="ti ti-refresh"></i> Refresh</button>
    <button class="export-btn" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>
    <button class="add-btn" onclick="openModal()"><i class="ti ti-plus"></i> Add card</button>
  </div>
</header>

<main>
  <div class="stat-row" id="stats">
    <div class="stat"><div class="stat-label">Total cards</div><div class="stat-value">—</div></div>
    <div class="stat"><div class="stat-label">HP</div><div class="stat-value" style="color:#BF360C">—</div></div>
    <div class="stat"><div class="stat-label">BPCL</div><div class="stat-value" style="color:#1B5E20">—</div></div>
    <div class="stat"><div class="stat-label">IOCL</div><div class="stat-value" style="color:#0D47A1">—</div></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <button class="brand-btn active" onclick="setFilter('all',this)">All</button>
      <button class="brand-btn hp" onclick="setFilter('HP',this)">HP</button>
      <button class="brand-btn bpcl" onclick="setFilter('BPCL',this)">BPCL</button>
      <button class="brand-btn iocl" onclick="setFilter('IOCL',this)">IOCL</button>
      <input class="search-bar" type="text" placeholder="Search by name, card no, vehicle, location…" oninput="renderTable()" id="search" />
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Card number</th>
            <th>Brand</th>
            <th>Assigned to</th>
            <th>Vehicle no</th>
            <th>Type</th>
            <th>Location</th>
            <th>Status</th>
            <th>Daily limit</th>
            <th>Monthly limit</th>
            <th>PIN</th>
            <th>Reference no</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr class="loading-row"><td colspan="13"><i class="ti ti-loader" style="font-size:20px;display:block;margin:0 auto 8px;color:#ccc"></i>Loading cards…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <p style="font-size:11px;color:var(--text-tertiary);text-align:center;margin-top:14px;">Live data — all team members see the same records in real time.</p>
</main>

<!-- Modal -->
<div class="modal-bg" id="modal-bg" onclick="bgClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Add petrol card</h2>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>Card number *</label><input id="f-cardno" placeholder="e.g. 4001 2345 6789"></div>
      <div class="form-group"><label>Brand *</label>
        <select id="f-brand"><option value="">Select brand</option><option>HP</option><option>BPCL</option><option>IOCL</option></select>
      </div>
      <div class="form-group"><label>Assigned to *</label><input id="f-name" placeholder="Employee name"></div>
      <div class="form-group"><label>Vehicle number *</label><input id="f-vehicle" placeholder="e.g. MH04 AB 1234"></div>
      <div class="form-group"><label>Vehicle type</label>
        <select id="f-type"><option value="">Select type</option><option>Car</option><option>SUV</option><option>Truck</option><option>Bike</option><option>Van</option><option>Bus</option><option>Other</option></select>
      </div>
      <div class="form-group"><label>Location</label><input id="f-location" placeholder="e.g. Mumbai"></div>
      <div class="form-group"><label>Status</label>
        <select id="f-status"><option>Active</option><option>Inactive</option><option>Blocked</option></select>
      </div>
      <div class="form-group"><label>PIN</label><input id="f-pin" placeholder="4-digit PIN" maxlength="4" type="password"></div>
      <div class="form-group"><label>Per day limit (₹)</label><input id="f-daily" type="number" placeholder="e.g. 2000"></div>
      <div class="form-group"><label>Monthly limit (₹)</label><input id="f-monthly" type="number" placeholder="e.g. 40000"></div>
      <div class="form-group full"><label>Reference number</label><input id="f-ref" placeholder="Internal or bank reference number"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="save-btn" onclick="saveCard()">Save card</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://shfeiquaiivfaqsjiwpp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoZmVpcXVhaWl2ZmFxc2ppd3BwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NTMzNDIsImV4cCI6MjA5NTQyOTM0Mn0.VVRz8sfusLqpCVzyQWtRMuoQkWr1qoi9VIDh1QKLGlg';
  const TABLE = 'petrol_cards';
  const HEADERS = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Prefer': 'return=representation' };

  let cards = [];
  let filterBrand = 'all';
  let editingId = null;
  let pinVisible = {};

  function setSyncStatus(state) {
    const dot = document.getElementById('sync-dot');
    const txt = document.getElementById('sync-text');
    dot.className = 'sync-dot' + (state === 'loading' ? ' loading' : state === 'error' ? ' error' : '');
    txt.textContent = state === 'loading' ? 'Syncing…' : state === 'error' ? 'Connection error' : 'Connected';
  }

  async function api(path, method='GET', body=null) {
    const opts = { method, headers: HEADERS };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
    if (!res.ok) { const err = await res.text(); throw new Error(err); }
    if (method === 'DELETE') return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  async function loadCards() {
    setSyncStatus('loading');
    try {
      cards = await api(TABLE + '?order=id.asc') || [];
      setSyncStatus('ok');
      renderStats();
      renderTable();
    } catch(e) {
      setSyncStatus('error');
      showToast('Could not load cards. Check your connection.', true);
    }
  }

  function fmt(n) {
    if (!n && n !== 0) return '—';
    return '₹' + Number(n).toLocaleString('en-IN');
  }

  function showToast(msg, isError=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.className = 'toast', 2500);
  }

  function renderStats() {
    const total = cards.length;
    const active = cards.filter(c => c.status === 'Active').length;
    const hp = cards.filter(c => c.brand === 'HP').length;
    const bpcl = cards.filter(c => c.brand === 'BPCL').length;
    const iocl = cards.filter(c => c.brand === 'IOCL').length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-label">Total cards</div><div class="stat-value">${total}</div><div class="stat-sub">${active} active</div></div>
      <div class="stat"><div class="stat-label">HP</div><div class="stat-value" style="color:#BF360C">${hp}</div><div class="stat-sub">cards</div></div>
      <div class="stat"><div class="stat-label">BPCL</div><div class="stat-value" style="color:#1B5E20">${bpcl}</div><div class="stat-sub">cards</div></div>
      <div class="stat"><div class="stat-label">IOCL</div><div class="stat-value" style="color:#0D47A1">${iocl}</div><div class="stat-sub">cards</div></div>
    `;
  }

  function renderTable() {
    const q = document.getElementById('search').value.toLowerCase();
    let data = cards.filter(c => {
      const matchBrand = filterBrand === 'all' || c.brand === filterBrand;
      const matchQ = !q || [c.cardno, c.name, c.vehicle, c.location, c.ref, c.type].some(v => v && v.toLowerCase().includes(q));
      return matchBrand && matchQ;
    });
    const body = document.getElementById('table-body');
    if (!data.length) {
      body.innerHTML = `<tr class="empty-row"><td colspan="13"><i class="ti ti-credit-card-off" style="font-size:24px;display:block;margin:0 auto 8px;color:#ccc"></i>No cards found</td></tr>`;
      return;
    }
    body.innerHTML = data.map((c, idx) => {
      const bClass = 'badge-' + (c.brand||'').toLowerCase();
      const sClass = c.status === 'Active' ? 'badge-active' : c.status === 'Blocked' ? 'badge-blocked' : 'badge-inactive';
      const showPin = pinVisible[c.id];
      return `<tr>
        <td style="color:var(--text-tertiary);font-size:12px">${idx+1}</td>
        <td style="font-family:var(--font-mono)">${c.cardno||'—'}</td>
        <td><span class="badge ${bClass}">${c.brand||'—'}</span></td>
        <td>${c.name||'—'}</td>
        <td style="font-weight:500">${c.vehicle||'—'}</td>
        <td>${c.type||'—'}</td>
        <td>${c.location||'—'}</td>
        <td><span class="badge ${sClass}">${c.status||'—'}</span></td>
        <td>${fmt(c.daily)}</td>
        <td>${fmt(c.monthly)}</td>
        <td>
          <div class="pin-cell" onclick="togglePin(${c.id})" title="Click to ${showPin?'hide':'show'} PIN">
            <span>${showPin ? (c.pin||'—') : '••••'}</span>
            <i class="ti ${showPin?'ti-eye-off':'ti-eye'}"></i>
          </div>
        </td>
        <td style="color:var(--text-secondary);font-size:12px">${c.ref||'—'}</td>
        <td>
          <div class="actions">
            <button class="icon-btn" onclick="editCard(${c.id})" title="Edit"><i class="ti ti-edit"></i></button>
            <button class="icon-btn del" onclick="deleteCard(${c.id})" title="Delete"><i class="ti ti-trash"></i></button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  function togglePin(id) { pinVisible[id] = !pinVisible[id]; renderTable(); }

  function setFilter(brand, btn) {
    filterBrand = brand;
    document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  function openModal() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'Add petrol card';
    clearForm();
    document.getElementById('modal-bg').classList.add('open');
  }

  function closeModal() { document.getElementById('modal-bg').classList.remove('open'); editingId = null; }
  function bgClick(e) { if (e.target === document.getElementById('modal-bg')) closeModal(); }

  function clearForm() {
    ['f-cardno','f-name','f-vehicle','f-location','f-pin','f-ref'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-brand').value = '';
    document.getElementById('f-type').value = '';
    document.getElementById('f-status').value = 'Active';
    document.getElementById('f-daily').value = '';
    document.getElementById('f-monthly').value = '';
  }

  function editCard(id) {
    const c = cards.find(x => x.id === id); if (!c) return;
    editingId = id;
    document.getElementById('modal-title').textContent = 'Edit petrol card';
    document.getElementById('f-cardno').value = c.cardno||'';
    document.getElementById('f-brand').value = c.brand||'';
    document.getElementById('f-name').value = c.name||'';
    document.getElementById('f-vehicle').value = c.vehicle||'';
    document.getElementById('f-type').value = c.type||'';
    document.getElementById('f-location').value = c.location||'';
    document.getElementById('f-status').value = c.status||'Active';
    document.getElementById('f-pin').value = c.pin||'';
    document.getElementById('f-daily').value = c.daily||'';
    document.getElementById('f-monthly').value = c.monthly||'';
    document.getElementById('f-ref').value = c.ref||'';
    document.getElementById('modal-bg').classList.add('open');
  }

  async function saveCard() {
    const cardno = document.getElementById('f-cardno').value.trim();
    const brand = document.getElementById('f-brand').value;
    const name = document.getElementById('f-name').value.trim();
    const vehicle = document.getElementById('f-vehicle').value.trim();
    if (!cardno || !brand || !name || !vehicle) { alert('Please fill in: Card number, Brand, Assigned to, and Vehicle number.'); return; }

    const obj = {
      cardno, brand, name, vehicle,
      type: document.getElementById('f-type').value,
      location: document.getElementById('f-location').value.trim(),
      status: document.getElementById('f-status').value,
      pin: document.getElementById('f-pin').value,
      daily: Number(document.getElementById('f-daily').value)||0,
      monthly: Number(document.getElementById('f-monthly').value)||0,
      ref: document.getElementById('f-ref').value.trim(),
    };

    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';
    setSyncStatus('loading');

    try {
      if (editingId) {
        await api(TABLE + '?id=eq.' + editingId, 'PATCH', obj);
        showToast('Card updated successfully');
      } else {
        await api(TABLE, 'POST', obj);
        showToast('Card added successfully');
      }
      closeModal();
      await loadCards();
    } catch(e) {
      showToast('Error saving card. Please try again.', true);
      setSyncStatus('error');
    } finally {
      btn.disabled = false; btn.textContent = 'Save card';
    }
  }

  async function deleteCard(id) {
    if (!confirm('Are you sure you want to delete this card? This cannot be undone.')) return;
    setSyncStatus('loading');
    try {
      await api(TABLE + '?id=eq.' + id, 'DELETE');
      showToast('Card deleted');
      await loadCards();
    } catch(e) {
      showToast('Error deleting card.', true);
      setSyncStatus('error');
    }
  }

  function exportCSV() {
    if (!cards.length) { alert('No cards to export.'); return; }
    const headers = ['Card Number','Brand','Assigned To','Vehicle Number','Vehicle Type','Location','Status','Daily Limit (INR)','Monthly Limit (INR)','PIN','Reference Number'];
    const rows = cards.map(c => [c.cardno,c.brand,c.name,c.vehicle,c.type,c.location,c.status,c.daily,c.monthly,c.pin,c.ref]
      .map(v => `"${(v||'').toString().replace(/"/g,'""')}"`).join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'petrol_cards_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    showToast('CSV exported');
  }

  loadCards();
  setInterval(loadCards, 30000);
</script>
</body>
</html>
